# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI

permissions:
  contents: read

on:
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ "master" ]
  pull_request: # 编译与离线单测不需要凭据，PR 上也应该跑到

env:
  # odps/tunnel 的 protoc 定长报文样例是按 Asia/Shanghai 的墙上时间生成的，
  # 时区不同这三个用例就会失败，所以把时区固定在用例假设值上，不依赖 runner 默认值。
  TZ: Asia/Shanghai

jobs:

  # 编译与离线单测：不取任何凭据，也不设 ODPS_RUN_LIVE_TESTS，任何环境（包括
  # fork 的 PR）都必须真跑。internal/livetest 要求显式 opt-in，所以就算某个
  # runner 恰好导出了 ALIBABA_CLOUD_* / odps_endpoint，需要真实项目的用例也只是
  # SKIP，不会去动服务。
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v ./...

    # tee 会把管道退出码变成 tee 自己的，所以这里显式 pipefail：go test 红了这条腿必须红。
    - name: Test (Expect Arrow Package)
      shell: bash
      run: |
        set -o pipefail
        go test -v $(go list ./... | grep -v './arrow') | tee /tmp/offline-test.log

    # `go test` 在用例被整体过滤掉时仍然 rc=0（包级报告写 "[no tests to run]"，实测见 PR 评论），
    # 所以“这条腿绿”不等于“用例跑了”。这一步把两件事钉住：没有报告要红，
    # 以及 PASS 行数低于下限要红。下限取 300（当前实测 341 行 PASS、31 行 SKIP），
    # 留出正常删改的余量，但用例大面积静默消失时一定拦下。
    - name: Assert the offline cases actually ran
      shell: bash
      env:
        MIN_PASSED_CASES: '300'
      run: |
        set -o pipefail
        LOG=/tmp/offline-test.log
        # 下限自己兜底并校验：env 丢了或写错时这一步要红，不能变成一个静默通过的比较。
        MIN="${MIN_PASSED_CASES:-300}"
        case "$MIN" in
          ''|*[!0-9]*)
            echo "::error::MIN_PASSED_CASES must be a positive integer, got \"$MIN\""
            exit 1
            ;;
        esac
        if [ ! -f "$LOG" ]; then
          echo "::error::no test log at $LOG - the Test step did not produce a report"
          exit 1
        fi
        if grep -q '\[no tests to run\]' "$LOG"; then
          echo "::error::at least one package reported \"no tests to run\"; the gate would be green while executing nothing"
          grep -n '\[no tests to run\]' "$LOG" | head -5
          exit 1
        fi
        # 下限只能抓住"大面积消失"：11-14 实测 12 个包各贡献 0 到 84 行 PASS，
        # floor 300 要一次少 42 行以上才咬，单个小包从结果里不见是漏的。
        # 所以把"该报的包都报了吗"直接对出来：go list 选中的集合必须等于报告里的集合。
        expected=$(go list ./... | grep -v './arrow' | sort)
        reported=$(grep -oE '^(ok|\?)[[:space:]]+[^[:space:]]+' "$LOG" | awk '{print $2}' | sort)
        if [ "$expected" != "$reported" ]; then
          echo "::error::the packages that reported are not the packages go list selected"
          diff <(printf '%s\n' "$expected") <(printf '%s\n' "$reported") || true
          exit 1
        fi
        echo "package set matches go list: $(printf '%s\n' "$expected" | grep -c .) packages"
        passed=$(grep -cE '^[[:space:]]*--- PASS' "$LOG")
        skipped=$(grep -cE '^[[:space:]]*--- SKIP' "$LOG")
        echo "executed cases (--- PASS lines): $passed (floor $MIN); skipped: $skipped"
        if [ "$passed" -lt "$MIN" ]; then
          echo "::error::only $passed cases reported PASS; the floor is $MIN"
          exit 1
        fi

  # 需要真实 MaxCompute 项目的用例：单独成 job，凭据取不到时页面必须有信号，
  # 而不是像以前那样在 get credentials 失败后把 Build/Test 全部 skipped。
  live-service:
    name: Live-service test (needs OIDC credentials)
    needs: build
    runs-on: ubuntu-latest
    # 只有这一档声明「我要跑真实项目的用例」：internal/livetest 要 ODPS_RUN_LIVE_TESTS=1
    # 且配置完整（ID/Secret 非空、endpoint 是带主机的 http(s)、给了 token 就不能为空）
    # 才放行；项目名在这里显式写出来，不靠代码里的默认值。
    env:
      ODPS_RUN_LIVE_TESTS: '1'
      ODPS_LIVE_TEST_PROJECT: go_sdk_regression_testing
    permissions:
      id-token: write     # 获取 oidc token 的权限
    steps:
    # secrets 在这个 job 之外取不到值（fork 的 PR、未配置 secrets 的仓库都是如此），
    # 所以先把「配没配」读成一个可比较的输出，并把它写在页面上，再决定跑不跑。
    - name: Check whether credentials are configured
      id: credentials
      env:
        ROLE_ARN: '${{ secrets.ROLE_ARN }}'
        OIDC_ARN: '${{ secrets.OIDC_ARN }}'
      run: |
        if [ -n "$ROLE_ARN" ] && [ -n "$OIDC_ARN" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Live-service tests not run::ROLE_ARN / OIDC_ARN are not available to this run, so the tests that need a real MaxCompute project did not run. The Build and Test steps in the build job are not affected."
          echo "### Live-service tests did not run" >> "$GITHUB_STEP_SUMMARY"
          echo "ROLE_ARN / OIDC_ARN are not available to this run (fork pull requests never receive repository secrets). The steps below are skipped, and this job is reported as successful *without* having tested anything." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: get credentials
      if: steps.credentials.outputs.configured == 'true'
      id: get-credentials
      uses: aliyun/configure-aliyun-credentials-action@v1.0.3
      with:
        role-to-assume: '${{ secrets.ROLE_ARN }}'
        oidc-provider-arn: '${{ secrets.OIDC_ARN }}'
        audience: 'actions.github.com' # default value

    - name: Set up environment
      if: steps.credentials.outputs.configured == 'true'
      run: |
        echo "ALIBABA_CLOUD_ACCESS_KEY_ID=${{ steps.get-credentials.outputs.aliyun-access-key-id }}" >> $GITHUB_ENV
        echo "ALIBABA_CLOUD_ACCESS_KEY_SECRET=${{ steps.get-credentials.outputs.aliyun-access-key-secret }}" >> $GITHUB_ENV
        echo "ALIBABA_CLOUD_SECURITY_TOKEN=${{ steps.get-credentials.outputs.aliyun-security-token }}" >> $GITHUB_ENV
        echo "odps_endpoint=${{ secrets.ENDPOINT }}" >> $GITHUB_ENV

    - uses: actions/checkout@v4
      if: steps.credentials.outputs.configured == 'true'

    - name: Set up Go
      if: steps.credentials.outputs.configured == 'true'
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build
      if: steps.credentials.outputs.configured == 'true'
      run: go build -v ./...

    - name: Test with credentials (Expect Arrow Package)
      if: steps.credentials.outputs.configured == 'true'
      run: go test -v $(go list ./... | grep -v './arrow')
